name: Martini KernelSU-Next 3.4.2 + SuSFS v2.3.0 (LineageOS 23.2)

# Base: your proven LineageOS 23.2 KernelSU-Next workflow (same toolchain, same
# make flags, same AnyKernel3) - only the root/SuSFS source changes.
#
# Root + hiding come from crDroid's sm8350 kernel (branch 17.0), which carries
# KernelSU-Next v3.4.2-legacy + SuSFS v2.3.0 (5.4 backport by JackA1ltman,
# adapted by crDroid). The KSU/SuSFS-only changes are extracted as a diff
# against LineageOS lineage-24.0 (crDroid's base) and applied to stock
# lineage-23.2. lineage-23.2 and lineage-24.0 differ in only 6 files, none of
# which are touched by this patch. Unrelated crDroid extras (force-fast-charge,
# haptics, lemonadep DTS, binder-freeze disable) are deliberately NOT copied.

on:
  workflow_dispatch:
    inputs:
      RELEASE_CONFIG:
        description: 'Upload to Releases'
        required: true
        default: true
        type: boolean
      KERNEL_SOURCE:
        description: 'Kernel Source'
        required: true
        default: "https://github.com/LineageOS/android_kernel_oneplus_sm8350.git"
        type: string
      KERNEL_SOURCE_BRANCH:
        description: 'Kernel Branch'
        required: true
        default: "lineage-23.2"
        type: string
      KERNEL_DEFCONFIG:
        description: 'Kernel Config'
        required: true
        default: "vendor/lahaina-qgki_defconfig"
        type: string
      CRDROID_COMMIT:
        description: 'crDroid sm8350 17.0 commit to take KSU-Next+SuSFS from (pinned, verified)'
        required: true
        default: "978e1519cc83f65994d3bd6c96c5bc6fbb56d38d"
        type: string
      LINEAGE_BASE_COMMIT:
        description: 'LineageOS lineage-24.0 commit crDroid is based on (diff base, pinned)'
        required: true
        default: "c156e7c9a5149ba1d6007c4fabc4584afc49cf78"
        type: string
      CCACHE_CONFIG:
        description: 'Use Ccache'
        required: true
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "2G"
      CCACHE_HARDLINK: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Ccache
        if: github.event.inputs.CCACHE_CONFIG == 'true'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: martini-ksun-susfs-v2

      - name: Setup Environment
        run: |
          export CLANG_PATH=~/clang
          git clone --depth=1 https://github.com/kdrag0n/proton-clang $CLANG_PATH
          sh -c "$(curl -sSL https://raw.githubusercontent.com/akhilnarang/scripts/master/setup/android_build_env.sh)"
          sudo apt install --fix-missing

      - name: Git kernel
        run: |
          git clone "${{ github.event.inputs.KERNEL_SOURCE }}" -b "${{ github.event.inputs.KERNEL_SOURCE_BRANCH }}" kernel --depth=1
          echo "TAG_NAME=v5.4.$(grep "^SUBLEVEL =" kernel/Makefile | awk '{print $3}')-$(date +"%Y%m%d")" >> $GITHUB_ENV

      - name: Port KernelSU-Next + SuSFS v2.3.0 from crDroid
        run: |
          set -euo pipefail
          W=$GITHUB_WORKSPACE

          fetch_commit() {   # $1=url $2=sha $3=dir
            git init -q "$3"
            git -C "$3" remote add origin "$1"
            git -C "$3" fetch -q --depth=1 origin "$2"
            git -C "$3" checkout -q FETCH_HEAD
          }
          fetch_commit https://github.com/crdroidandroid/android_kernel_oneplus_sm8350.git \
                       "${{ github.event.inputs.CRDROID_COMMIT }}" $W/crd
          fetch_commit https://github.com/LineageOS/android_kernel_oneplus_sm8350.git \
                       "${{ github.event.inputs.LINEAGE_BASE_COMMIT }}" $W/l24

          # Every file crDroid changed for KSU-Next/SuSFS (drivers/kernelsu handled separately)
          FILES="drivers/Kconfig drivers/Makefile fs/Makefile fs/internal.h fs/namei.c
                 fs/namespace.c fs/notify/fdinfo.c fs/proc/base.c fs/proc/cmdline.c fs/proc/fd.c
                 fs/proc/task_mmu.c fs/proc_namespace.c fs/readdir.c fs/stat.c fs/statfs.c
                 fs/super.c fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h
                 kernel/kallsyms.c kernel/sys.c mm/memory.c security/selinux/avc.c"
          rm -rf $W/pa $W/pb; mkdir -p $W/pa $W/pb
          for f in $FILES; do
            if [ -e $W/l24/$f ]; then mkdir -p $W/pa/$(dirname $f); cp $W/l24/$f $W/pa/$f; fi
            if [ -e $W/crd/$f ]; then mkdir -p $W/pb/$(dirname $f); cp $W/crd/$f $W/pb/$f; fi
          done
          cd $W
          # diff exits 1 when files differ - that is expected here
          diff -ruN pa pb | sed -E 's#^--- pa/#--- a/#; s#^\+\+\+ pb/#+++ b/#' > ksun-susfs.patch || true
          echo "Patch touches $(grep -c '^+++ ' ksun-susfs.patch) files"
          test "$(grep -c '^+++ ' ksun-susfs.patch)" -eq 23

          cd $W/kernel
          # Fail loudly (with the reason) if Lineage ever changes one of these files
          if ! patch -p1 --dry-run < $W/ksun-susfs.patch > $W/dryrun.txt; then
            cat $W/dryrun.txt
            echo "::error::KSU-Next/SuSFS patch no longer applies cleanly to ${{ github.event.inputs.KERNEL_SOURCE_BRANCH }}"
            exit 1
          fi
          patch -p1 -s < $W/ksun-susfs.patch

          # KernelSU-Next driver (cp -a keeps its include/uapi symlink)
          rm -rf drivers/kernelsu
          cp -a $W/crd/drivers/kernelsu drivers/kernelsu

          # Config - identical to crDroid 17.0 (kprobes hook; SuSFS try_umount left
          # off on purpose, KSU-Next's own kernel umount handles it)
          D="arch/arm64/configs/${{ github.event.inputs.KERNEL_DEFCONFIG }}"
          scripts/config --file "$D" -e MODULES -e KPROBES -e HAVE_KPROBES -e KPROBE_EVENTS -e KRETPROBES
          cat >> "$D" <<'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_KPROBES_HOOK=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          # CONFIG_KSU_SUSFS_TRY_UMOUNT is not set
          EOF
          sed -i 's/^[[:space:]]*\(CONFIG_\|# CONFIG_\)/\1/' "$D"

          echo "== Sanity =="
          grep -n 'define SUSFS_VERSION' include/linux/susfs.h
          grep -n 'KSU_VERSION_OVERRIDE :=' drivers/kernelsu/Kbuild
          grep -n 'susfs.o' fs/Makefile
          grep -n 'kernelsu' drivers/Makefile drivers/Kconfig
          rm -rf $W/crd $W/l24 $W/pa $W/pb

      - name: Make kernel
        run: |
          set -eo pipefail
          cd $GITHUB_WORKSPACE/kernel
          export KERNEL_DEFCONFIG=${{ github.event.inputs.KERNEL_DEFCONFIG }}
          export CLANG_PATH=~/clang
          # proton appended (not prepended) - its old GNU ld breaks host tools on 24.04
          export PATH=${PATH}:${CLANG_PATH}/bin
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export ARCH=arm64
          export SUBARCH=arm64
          B=$CLANG_PATH/bin

          $B/clang --version | head -n 1

          MAKE_ARGS=(
            O=out
            ARCH=arm64
            CC="ccache $B/clang"
            CXX="ccache $B/clang++"
            LD=$B/ld.lld
            AR=$B/llvm-ar
            NM=$B/llvm-nm
            OBJCOPY=$B/llvm-objcopy
            OBJDUMP=$B/llvm-objdump
            STRIP=$B/llvm-strip
            HOSTCC=gcc
            HOSTCXX=g++
            HOSTLD=/usr/bin/ld
            CROSS_COMPILE=$B/aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=$B/arm-linux-gnueabi-
          )

          make "${MAKE_ARGS[@]}" $KERNEL_DEFCONFIG

          echo "== Resolved KSU/SuSFS config =="
          grep -E '^(# )?CONFIG_KSU' out/.config
          # Kconfig silently drops options whose deps are unmet - catch that here
          for c in KSU KSU_KPROBES_HOOK KSU_SUSFS KSU_SUSFS_SUS_PATH KSU_SUSFS_SUS_MOUNT; do
            grep -q "^CONFIG_$c=y" out/.config || { echo "::error::CONFIG_$c did not survive olddefconfig"; exit 1; }
          done

          if [[ $(echo "$(awk '/MemTotal/ {print $2}' /proc/meminfo) < 16000000" | bc -l) -eq 1 ]]; then
              scripts/config --file out/.config -d LTO -d LTO_CLANG -d THINLTO -e LTO_NONE
          fi

          make "${MAKE_ARGS[@]}" -j"$(nproc)" 2>&1 | tee kernel.log

          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "::error::Build finished but out/arch/arm64/boot/Image is missing"
            exit 1
          fi
          ls -lh out/arch/arm64/boot/Image

          echo "== Verify root + SuSFS really are inside the Image =="
          grep -E 'KernelSU-Next version override|SUSFS_VERSION|Hook mode' kernel.log | sort -u
          strings out/arch/arm64/boot/Image | grep -m1 'susfs is initialized! version: v2' \
            || { echo "::error::SuSFS init string not found in Image"; exit 1; }
          strings out/arch/arm64/boot/Image | grep -m1 -i 'kernelsu' \
            || { echo "::error::KernelSU strings not found in Image"; exit 1; }
          strings out/arch/arm64/boot/Image | grep -m1 'Linux version'

      - name: Create Anykernel3 file
        run: |
          set -eo pipefail
          cd $GITHUB_WORKSPACE/kernel
          export KERNEL_PATH=$PWD
          git clone https://gitlab.com/inferno0230/AnyKernel3.git --depth=1 $KERNEL_PATH/AnyKernel3

          zip_name="ONEPLUS9RT-KSUNext-SuSFSv2-${{ env.TAG_NAME }}.zip"
          cd $KERNEL_PATH/AnyKernel3
          cp $KERNEL_PATH/out/arch/arm64/boot/Image $KERNEL_PATH/AnyKernel3
          zip -r9 ${zip_name} * -x '.git*' README.md
          mv ${zip_name} $KERNEL_PATH/out/arch/arm64/boot
          unzip -l $KERNEL_PATH/out/arch/arm64/boot/${zip_name} | grep -E ' Image$'
          # Raw Image as well, for `fastboot boot` testing via a repacked boot.img
          cp $KERNEL_PATH/out/arch/arm64/boot/Image $GITHUB_WORKSPACE/Image

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-log
          path: |
            kernel/kernel.log
            ksun-susfs.patch
            dryrun.txt
          if-no-files-found: ignore

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ONEPLUS9RT-KSUNext-SuSFSv2-${{ env.TAG_NAME }}
          path: |
            kernel/AnyKernel3/*
          if-no-files-found: error

      - name: Upload to Release
        if: github.event.inputs.RELEASE_CONFIG == 'true'
        uses: ncipollo/release-action@v1
        with:
          artifacts: "kernel/out/arch/arm64/boot/ONEPLUS9RT-KSUNext-SuSFSv2-${{ env.TAG_NAME }}.zip,Image"
          tag: "ONEPLUS9RT-KSUNext-SuSFSv2-${{ env.TAG_NAME }}"
          name: "OnePlus 9RT KernelSU-Next 3.4.2 + SuSFS v2.3.0 ${{ env.TAG_NAME }}"
          allowUpdates: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
