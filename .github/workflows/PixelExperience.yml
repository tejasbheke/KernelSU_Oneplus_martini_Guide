name: Martini KernelSU-SUSFS (Option A)

on:
  workflow_dispatch:
    inputs:
      RELEASE_CONFIG:
        description: 'Upload to Releases'
        required: true
        default: true
        type: boolean
      KERNEL_SOURCE:
        description: 'Kernel Source (already has SuSFS + martini defconfig)'
        required: true
        default: "https://github.com/natsumerinchan/android_kernel_oneplus_sm8350.git"
        type: string
      KERNEL_SOURCE_BRANCH:
        description: 'Kernel Branch'
        required: true
        default: "fourteen-qpr3"
        type: string
      KERNEL_DEFCONFIG:
        description: 'Kernel Config'
        required: true
        default: "vendor/lahaina-qgki_defconfig"
        type: string
      KERNELSU_TAG:
        description: 'tiann/KernelSU setup.sh tag/branch (main = latest)'
        required: false
        default: "main"
        type: string
      CCACHE_CONFIG:
        description: 'Use Ccache'
        required: true
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "2G"
      CCACHE_HARDLINK: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Ccache
        if: github.event.inputs.CCACHE_CONFIG == 'true'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: martini-susfs-optionA

      - name: Setup Environment
        run: |
          export CLANG_PATH=~/clang
          git clone --depth=1 https://github.com/kdrag0n/proton-clang $CLANG_PATH
          sh -c "$(curl -sSL https://raw.githubusercontent.com/akhilnarang/scripts/master/setup/android_build_env.sh)"
          sudo apt install --fix-missing

      - name: Git kernel
        run: |
          git clone "${{ github.event.inputs.KERNEL_SOURCE }}" -b "${{ github.event.inputs.KERNEL_SOURCE_BRANCH }}" kernel --depth=1
          echo "TAG_NAME=v5.4.$(grep "^SUBLEVEL =" kernel/Makefile | awk '{print $3}')-$(date +"%Y%m%d")" >> $GITHUB_ENV

      - name: Setup KernelSU + SuSFS
        run: |
          set -eo pipefail
          cd $GITHUB_WORKSPACE/kernel

          # Make sure the GKI/Kprobes bits the defconfig expects are enabled
          scripts/config --file "arch/arm64/configs/${{ github.event.inputs.KERNEL_DEFCONFIG }}" \
            -e MODULES -e KPROBES -e HAVE_KPROBES -e KPROBE_EVENTS

          # SuSFS-patched KernelSU fork (original KernelSU, not KernelSU-Next)
          test -d KernelSU && rm -rf KernelSU
          git clone -b main https://github.com/natsumerinchan/KernelSU.git

          scripts/config --file "arch/arm64/configs/${{ github.event.inputs.KERNEL_DEFCONFIG }}" \
            --set-val CONFIG_KSU y --set-val CONFIG_KSU_SUSFS y

          # tiann/KernelSU's own setup.sh wires the driver into drivers/Makefile & Kconfig
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s "${{ github.event.inputs.KERNELSU_TAG }}"

      - name: Point python2 at python3 for mkdtboimg.py
        run: |
          set -eo pipefail
          # The kernel's dtbo.img rule invokes `python2`, which Ubuntu 24.04
          # ships nowhere (confirmed: default repos and deadsnakes PPA both
          # lack it). mkdtboimg.py runs under python3 almost as-is, with one
          # real exception: a single `xrange()` call (py2-only; py3 only has
          # `range`). Patch that one line, then point `python2` at python3
          # so the Makefile's hardcoded interpreter name resolves.
          sed -i 's/\bxrange(/range(/g' $GITHUB_WORKSPACE/kernel/scripts/mkdtboimg.py
          sudo ln -sf "$(command -v python3)" /usr/local/bin/python2
          python2 --version

      - name: Make kernel
        run: |
          set -eo pipefail
          cd $GITHUB_WORKSPACE/kernel
          export KERNEL_DEFCONFIG=${{ github.event.inputs.KERNEL_DEFCONFIG }}
          export KERNEL_PATH=$PWD
          export CLANG_PATH=~/clang
          # PATH order matches the known-working build: proton appended, tools called by absolute path
          export PATH=${PATH}:${CLANG_PATH}/bin
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export ARCH=arm64
          export SUBARCH=arm64
          B=$CLANG_PATH/bin

          echo "== Toolchain check =="
          $B/clang --version | head -n 1
          gcc --version | head -n 1

          MAKE_ARGS=(
            O=out
            ARCH=arm64
            CC="ccache $B/clang"
            CXX="ccache $B/clang++"
            LD=$B/ld.lld
            AR=$B/llvm-ar
            NM=$B/llvm-nm
            OBJCOPY=$B/llvm-objcopy
            OBJDUMP=$B/llvm-objdump
            STRIP=$B/llvm-strip
            HOSTCC=gcc
            HOSTCXX=g++
            HOSTLD=/usr/bin/ld
            CROSS_COMPILE=$B/aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=$B/arm-linux-gnueabi-
          )

          make "${MAKE_ARGS[@]}" $KERNEL_DEFCONFIG

          if [[ $(echo "$(awk '/MemTotal/ {print $2}' /proc/meminfo) < 16000000" | bc -l) -eq 1 ]]; then
              scripts/config --file out/.config -d LTO -d LTO_CLANG -d THINLTO -e LTO_NONE
          fi

          make "${MAKE_ARGS[@]}" -j"$(nproc)" 2>&1 | tee kernel.log

          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "::error::Build finished but out/arch/arm64/boot/Image is missing"
            exit 1
          fi
          ls -lh out/arch/arm64/boot/Image

      - name: Create Anykernel3 file
        run: |
          set -eo pipefail
          cd $GITHUB_WORKSPACE/kernel
          export KERNEL_PATH=$PWD
          git clone https://gitlab.com/inferno0230/AnyKernel3.git --depth=1 $KERNEL_PATH/AnyKernel3

          test -f $KERNEL_PATH/out/arch/arm64/boot/Image
          zip_name="ONEPLUS9RT-KSU-SUSFS-${{ env.TAG_NAME }}.zip"
          cd $KERNEL_PATH/AnyKernel3
          cp $KERNEL_PATH/out/arch/arm64/boot/Image $KERNEL_PATH/AnyKernel3
          zip -r9 ${zip_name} * -x '.git*' README.md
          mv ${zip_name} $KERNEL_PATH/out/arch/arm64/boot
          unzip -l $KERNEL_PATH/out/arch/arm64/boot/${zip_name} | grep -E ' Image$'

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-log
          path: kernel/kernel.log
          if-no-files-found: ignore

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ONEPLUS9RT-KSU-SUSFS-${{ env.TAG_NAME }}
          path: |
            kernel/AnyKernel3/*
          if-no-files-found: error

      - name: Upload to Release
        if: github.event.inputs.RELEASE_CONFIG == 'true'
        uses: ncipollo/release-action@v1
        with:
          artifacts: "kernel/out/arch/arm64/boot/ONEPLUS9RT-KSU-SUSFS-${{ env.TAG_NAME }}.zip"
          tag: "ONEPLUS9RT-KSU-SUSFS-${{ env.TAG_NAME }}"
          name: "OnePlus 9RT KernelSU+SuSFS ${{ env.TAG_NAME }}"
          allowUpdates: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
